name: affiliate-hub
region: sfo
services:
  - name: web
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
databases:
  - name: db
    engine: PG
    version: "16"
